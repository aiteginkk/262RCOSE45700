# Rebuild the profiling dashboard and publish it to GitHub Pages
# whenever new results or dashboard code reach main.
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
# The page is then at https://<owner>.github.io/<repo>/

name: Dashboard

on:
  push:
    branches: ["main"]
    paths:
      - "results/**"
      - "experiments/profiling/make_dashboard.py"
      - "experiments/profiling/analyze_trace.py"
      - "experiments/profiling/dashboard_template.html"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard
        run: |
          mkdir -p site
          python experiments/profiling/make_dashboard.py --auto --output site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
